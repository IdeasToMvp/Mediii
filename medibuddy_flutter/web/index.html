<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MediSathi — organize health records and prescriptions.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MediSathi">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MediSathi</title>
  <link rel="manifest" href="manifest.json">

  <!-- Razorpay Standard Checkout: required for subscription pay on web (hosted short_url often shows "Hosted page is not available"). -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    function openRazorpaySubscriptionCheckout(optionsJson) {
      try {
        var o = JSON.parse(optionsJson);
        var rzp = new Razorpay({
          key: o.key,
          subscription_id: o.subscription_id,
          name: o.name || 'MediSathi',
          description: o.description || 'Pro subscription',
          prefill: o.prefill || {},
          handler: function (response) {
            window.dispatchEvent(new CustomEvent('razorpay-success', { detail: JSON.stringify(response) }));
          },
          modal: {
            ondismiss: function () {
              window.dispatchEvent(new CustomEvent('razorpay-dismiss'));
            }
          }
        });
        rzp.on('payment.failed', function (resp) {
          var err = (resp && resp.error) ? resp.error : resp;
          window.dispatchEvent(new CustomEvent('razorpay-failed', { detail: JSON.stringify(err || {}) }));
        });
        rzp.open();
      } catch (e) {
        window.dispatchEvent(new CustomEvent('razorpay-failed', { detail: JSON.stringify({ description: String(e) }) }));
      }
    }
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
