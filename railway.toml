# MediBuddy API on Railway — monorepo (no package.json at repo root).
#
# Railpack expects a detectable app at the root of the cloned repo; without a
# root package.json it fails. This uses the Dockerfile builder for `backend/`.
#
# Dashboard:
#   - Root Directory: leave empty "/" (whole repo checkout so Dockerfile path resolves).
#   - Config-as-code path: `/railway.toml`
# Variables: SUPABASE_URL, SUPABASE_ANON_KEY, OPENAI_API_KEY (+ optional OPENAI_VISION_MODEL)
#
# https://docs.railway.com/builds/build-configuration

[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"
watchPatterns = ["/backend/**"]

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
